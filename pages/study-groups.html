<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem('unicircle_theme')||'system';var r=t==='system'?(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):t;document.documentElement.setAttribute('data-theme',r);}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Groups — UniCircle</title>
<link rel="stylesheet" href="../src/css/base.css">
<link rel="stylesheet" href="../src/css/layout.css">
<link rel="stylesheet" href="../src/css/components.css">
<link rel="stylesheet" href="../src/css/animations.css">
</head>
<body>

<div class="app-shell">
  <div id="rail-mount"></div>

  <main class="main route-fade">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom: var(--space-5); flex-wrap:wrap; gap: var(--space-3);">
      <h1 style="margin:0;">Study Groups</h1>
      <button class="btn btn-primary" id="new-group-btn">Create Group</button>
    </div>

    <div id="scope-filter" class="category-chips" style="margin-bottom: var(--space-5);">
      <button type="button" class="category-chip active" data-scope="all">All Groups</button>
      <button type="button" class="category-chip" data-scope="mine">My Groups</button>
    </div>

    <div id="group-list">
      <div class="skeleton" style="height:140px; margin-bottom: var(--space-3);"></div>
    </div>
  </main>
</div>

<div id="tabbar-mount"></div>

<script type="module" src="../src/js/study-groups.js"></script>
</body>
</html>
