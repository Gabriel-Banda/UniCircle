<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — UniCircle</title>
  <link rel="stylesheet" href="/src/css/base.css" />
  <link rel="stylesheet" href="/src/css/animations.css" />
  <link rel="stylesheet" href="/src/css/components.css" />
  <link rel="stylesheet" href="/src/css/layout.css" />
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem;">
  <div class="card animate-scale-in" style="width: 100%; max-width: 460px; padding: 2.5rem 2rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <a href="/" class="header-brand" style="justify-content: center; margin-bottom: 0.75rem;">
        <div class="brand-icon-wrap">🎓</div>
        <span>Uni<span class="text-gradient">Circle</span></span>
      </a>
      <h2 style="font-size: 1.5rem; margin-bottom: 0.25rem;">Join UniCircle</h2>
      <p style="font-size: 0.875rem;">Start your genuine academic journey</p>
    </div>

    <form id="signup-form">
      <div class="input-group">
        <label class="input-label">Full Name *</label>
        <input type="text" id="name-input" class="input-field" placeholder="e.g. Gabriel Vance" required autofocus />
      </div>

      <div class="input-group">
        <label class="input-label">Username *</label>
        <input type="text" id="username-input" class="input-field" placeholder="e.g. gabriel_vance" required />
        <span style="font-size: 0.75rem; color: var(--text-tertiary);">Letters, numbers, underscores or periods</span>
      </div>

      <div class="input-group">
        <label class="input-label">Email Address *</label>
        <input type="email" id="email-input" class="input-field" placeholder="e.g. gabriel@university.edu" required />
      </div>

      <div class="input-group">
        <label class="input-label">Password *</label>
        <input type="password" id="password-input" class="input-field" placeholder="At least 6 characters" required minlength="6" />
      </div>

      <button type="submit" id="submit-btn" class="btn btn-primary btn-interactive" style="width: 100%; margin-top: 0.5rem; padding: 0.75rem;">
        Create Account & Continue
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--text-secondary);">
      Already have an account? <a href="/pages/login.html" style="color: var(--brand-primary); font-weight: 600;">Sign in</a>
    </div>
  </div>

  <script type="module">
    import { initTheme } from '/src/js/config.js';
    import { api } from '/src/js/api.js';
    import { auth } from '/src/js/auth.js';
    import { toast } from '/src/js/components/toast.js';

    initTheme();
    auth.checkGuest();

    const form = document.getElementById('signup-form');
    const submitBtn = document.getElementById('submit-btn');

    form.onsubmit = async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account...';

      const name = document.getElementById('name-input').value.trim();
      const username = document.getElementById('username-input').value.trim();
      const email = document.getElementById('email-input').value.trim();
      const password = document.getElementById('password-input').value;

      try {
        const res = await api.post('/auth/register', { name, username, email, password });
        auth.setSession(res.token, res.user);
        toast.success('Account created! Let\'s set up your academic profile.');
        window.location.href = '/pages/onboarding.html';
      } catch (err) {
        toast.error(err.message || 'Registration failed.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account & Continue';
      }
    };
  </script>
</body>
</html>
