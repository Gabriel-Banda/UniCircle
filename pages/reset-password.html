<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — UniCircle</title>
  <link rel="stylesheet" href="/src/css/base.css" />
  <link rel="stylesheet" href="/src/css/animations.css" />
  <link rel="stylesheet" href="/src/css/components.css" />
  <link rel="stylesheet" href="/src/css/layout.css" />
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem;">
  <div class="card animate-scale-in" style="width: 100%; max-width: 440px; padding: 2.5rem 2rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <a href="/" class="header-brand" style="justify-content: center; margin-bottom: 0.75rem;">
        <div class="brand-icon-wrap">🎓</div>
        <span>Uni<span class="text-gradient">Circle</span></span>
      </a>
      <h2 style="font-size: 1.5rem; margin-bottom: 0.25rem;">Reset Password</h2>
      <p style="font-size: 0.875rem;" id="form-subtitle">Enter your email to receive a password reset link</p>
    </div>

    <!-- Request Form -->
    <form id="request-form">
      <div class="input-group">
        <label class="input-label">Email Address</label>
        <input type="email" id="email-input" class="input-field" placeholder="e.g. student@uni.edu" required autofocus />
      </div>

      <button type="submit" id="request-submit-btn" class="btn btn-primary btn-interactive" style="width: 100%; margin-top: 0.5rem; padding: 0.75rem;">
        Generate Reset Link
      </button>
    </form>

    <!-- Token Reset Form (if token is in URL) -->
    <form id="execute-form" style="display: none;">
      <div class="input-group">
        <label class="input-label">New Password</label>
        <input type="password" id="new-password-input" class="input-field" placeholder="At least 6 characters" required minlength="6" />
      </div>

      <button type="submit" id="execute-submit-btn" class="btn btn-primary btn-interactive" style="width: 100%; margin-top: 0.5rem; padding: 0.75rem;">
        Update Password & Log In
      </button>
    </form>

    <div id="reset-result-box" style="display: none; margin-top: 1.5rem; background: var(--bg-surface-elevated); padding: 1rem; border-radius: var(--radius-md); font-size: 0.875rem;">
      <p style="color: var(--accent-green); font-weight: 600; margin-bottom: 0.5rem;">Reset link generated:</p>
      <a id="reset-link-anchor" href="#" style="color: var(--brand-primary); word-break: break-all; text-decoration: underline;"></a>
    </div>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--text-secondary);">
      Remember your password? <a href="/pages/login.html" style="color: var(--brand-primary); font-weight: 600;">Back to log in</a>
    </div>
  </div>

  <script type="module">
    import { initTheme } from '/src/js/config.js';
    import { api } from '/src/js/api.js';
    import { toast } from '/src/js/components/toast.js';

    initTheme();

    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    const requestForm = document.getElementById('request-form');
    const executeForm = document.getElementById('execute-form');
    const subtitle = document.getElementById('form-subtitle');

    if (token) {
      requestForm.style.display = 'none';
      executeForm.style.display = 'block';
      subtitle.textContent = 'Enter your new password below';

      executeForm.onsubmit = async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById('execute-submit-btn');
        submitBtn.disabled = true;
        const new_password = document.getElementById('new-password-input').value;

        try {
          await api.post('/auth/reset-password', { token, new_password });
          toast.success('Password reset successfully!');
          setTimeout(() => window.location.href = '/pages/login.html', 1500);
        } catch (err) {
          toast.error(err.message || 'Failed to reset password.');
          submitBtn.disabled = false;
        }
      };
    } else {
      requestForm.onsubmit = async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById('request-submit-btn');
        submitBtn.disabled = true;
        const email = document.getElementById('email-input').value.trim();

        try {
          const res = await api.post('/auth/reset-password-request', { email });
          toast.success('Password reset link generated.');
          if (res.resetUrl) {
            const box = document.getElementById('reset-result-box');
            const anchor = document.getElementById('reset-link-anchor');
            anchor.href = res.resetUrl;
            anchor.textContent = window.location.origin + res.resetUrl;
            box.style.display = 'block';
          }
        } catch (err) {
          toast.error(err.message || 'Failed to generate reset link.');
        } finally {
          submitBtn.disabled = false;
        }
      };
    }
  </script>
</body>
</html>
