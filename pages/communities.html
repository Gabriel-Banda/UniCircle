<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Communities — UniCircle</title>
  <link rel="stylesheet" href="/src/css/base.css" />
  <link rel="stylesheet" href="/src/css/animations.css" />
  <link rel="stylesheet" href="/src/css/components.css" />
  <link rel="stylesheet" href="/src/css/layout.css" />
</head>
<body>
  <div class="app-wrapper">
    <header class="top-header"></header>

    <div class="main-layout">
      <aside class="left-sidebar"></aside>

      <main class="content-stream">
        <div>
          <h1 style="font-size: 1.75rem;">Academic Communities</h1>
          <p style="font-size: 0.9375rem;">Find and join spaces organized by university, faculty, degree program, and courses.</p>
        </div>

        <!-- Level Filter Tabs -->
        <div class="tab-nav">
          <button class="tab-item active" data-level="">All Spaces</button>
          <button class="tab-item" data-level="institution">🏛️ Institutions</button>
          <button class="tab-item" data-level="faculty">🔬 Faculties</button>
          <button class="tab-item" data-level="program">📚 Programs</button>
          <button class="tab-item" data-level="course">📖 Courses</button>
        </div>

        <div style="display: flex; gap: 0.75rem; align-items: center;">
          <input type="text" id="comm-search-input" class="input-field" placeholder="Search communities by name..." />
        </div>

        <div id="communities-grid" class="stagger-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem;"></div>
      </main>

      <aside class="right-rail"></aside>
    </div>
  </div>

  <script type="module" src="/src/js/pages/communities.js"></script>
</body>
</html>
