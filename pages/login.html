<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — UniCircle</title>
  <link rel="stylesheet" href="/src/css/base.css" />
  <link rel="stylesheet" href="/src/css/animations.css" />
  <link rel="stylesheet" href="/src/css/components.css" />
  <link rel="stylesheet" href="/src/css/layout.css" />
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem;">
  <div class="card animate-scale-in" style="width: 100%; max-width: 440px; padding: 2.5rem 2rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <a href="/" class="header-brand" style="justify-content: center; margin-bottom: 0.75rem;">
        <div class="brand-icon-wrap">🎓</div>
        <span>Uni<span class="text-gradient">Circle</span></span>
      </a>
      <h2 style="font-size: 1.5rem; margin-bottom: 0.25rem;">Welcome back</h2>
      <p style="font-size: 0.875rem;">Sign in to your academic community</p>
    </div>

    <form id="login-form">
      <div class="input-group">
        <label class="input-label">Email or Username</label>
        <input type="text" id="login-input" class="input-field" placeholder="e.g. student@uni.edu or alex_smith" required autofocus />
      </div>

      <div class="input-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.375rem;">
          <label class="input-label" style="margin-bottom: 0;">Password</label>
          <a href="/pages/reset-password.html" style="font-size: 0.75rem; color: var(--brand-primary); font-weight: 600;">Forgot password?</a>
        </div>
        <input type="password" id="password-input" class="input-field" placeholder="••••••••" required />
      </div>

      <button type="submit" id="submit-btn" class="btn btn-primary btn-interactive" style="width: 100%; margin-top: 0.5rem; padding: 0.75rem;">
        Log In
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--text-secondary);">
      Don't have an account? <a href="/pages/signup.html" style="color: var(--brand-primary); font-weight: 600;">Create one</a>
    </div>
  </div>

  <script type="module">
    import { initTheme } from '/src/js/config.js';
    import { api } from '/src/js/api.js';
    import { auth } from '/src/js/auth.js';
    import { toast } from '/src/js/components/toast.js';

    initTheme();
    auth.checkGuest();

    const form = document.getElementById('login-form');
    const submitBtn = document.getElementById('submit-btn');

    form.onsubmit = async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      const login = document.getElementById('login-input').value.trim();
      const password = document.getElementById('password-input').value;

      try {
        const res = await api.post('/auth/login', { login, password });
        auth.setSession(res.token, res.user);
        toast.success('Welcome back!');

        // Check if onboarding completed
        if (!res.user.institution_id) {
          window.location.href = '/pages/onboarding.html';
        } else {
          const params = new URLSearchParams(window.location.search);
          const redirect = params.get('redirect') || '/pages/home.html';
          window.location.href = redirect;
        }
      } catch (err) {
        toast.error(err.message || 'Login failed.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Log In';
      }
    };
  </script>
</body>
</html>
