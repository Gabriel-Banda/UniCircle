<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discussions — UniCircle</title>
  <link rel="stylesheet" href="/src/css/base.css" />
  <link rel="stylesheet" href="/src/css/animations.css" />
  <link rel="stylesheet" href="/src/css/components.css" />
  <link rel="stylesheet" href="/src/css/layout.css" />
</head>
<body>
  <div class="app-wrapper">
    <header class="top-header"></header>

    <div class="main-layout">
      <aside class="left-sidebar"></aside>

      <main class="content-stream">
        <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem;">
          <div>
            <h1 style="font-size: 1.75rem;">Academic Discussions</h1>
            <p style="font-size: 0.9375rem;">Explore questions, course discussions, and study help from your classmates.</p>
          </div>
          <button id="open-new-disc-modal-btn" class="btn btn-primary btn-interactive">
            <span>✍️</span>
            <span>New Discussion</span>
          </button>
        </div>

        <!-- Filter bar -->
        <div style="display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.25rem;" id="disc-category-pills"></div>

        <div style="display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem;">
          <input type="text" id="disc-filter-search" class="input-field" placeholder="Search within discussions..." style="max-width: 320px; padding: 0.45rem 0.875rem; font-size: 0.875rem;" />

          <select id="disc-sort-select" class="select-field" style="width: auto; padding: 0.35rem 2rem 0.35rem 0.75rem; font-size: 0.8125rem;">
            <option value="recent">Most Recent</option>
            <option value="popular">Most Upvoted</option>
            <option value="unanswered">Unanswered</option>
          </select>
        </div>

        <div id="discussions-list-container" class="stagger-container" style="display: flex; flex-direction: column; gap: 1rem;"></div>
      </main>

      <aside class="right-rail"></aside>
    </div>
  </div>

  <script type="module" src="/src/js/pages/discussions.js"></script>
</body>
</html>
