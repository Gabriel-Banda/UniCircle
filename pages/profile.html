<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Profile — UniCircle</title>
  <link rel="stylesheet" href="/src/css/base.css" />
  <link rel="stylesheet" href="/src/css/animations.css" />
  <link rel="stylesheet" href="/src/css/components.css" />
  <link rel="stylesheet" href="/src/css/layout.css" />
</head>
<body>
  <div class="app-wrapper">
    <header class="top-header"></header>

    <div class="main-layout">
      <aside class="left-sidebar"></aside>

      <main class="content-stream">
        <div id="profile-card-container"></div>

        <div class="tab-nav" style="margin-top: 1.5rem;">
          <button class="tab-item active" data-tab="discussions">💬 Discussions</button>
          <button class="tab-item" data-tab="courses">📖 Enrolled Courses</button>
          <button class="tab-item" data-tab="activity">⚡ Activity</button>
        </div>

        <div id="profile-tab-content" class="stagger-container"></div>
      </main>

      <aside class="right-rail"></aside>
    </div>
  </div>

  <script type="module" src="/src/js/pages/profile.js"></script>
</body>
</html>
