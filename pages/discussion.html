<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discussion — UniCircle</title>
  <link rel="stylesheet" href="/src/css/base.css" />
  <link rel="stylesheet" href="/src/css/animations.css" />
  <link rel="stylesheet" href="/src/css/components.css" />
  <link rel="stylesheet" href="/src/css/layout.css" />
</head>
<body>
  <div class="app-wrapper">
    <header class="top-header"></header>

    <div class="main-layout">
      <aside class="left-sidebar"></aside>

      <main class="content-stream">
        <div style="margin-bottom: 0.5rem;">
          <a href="/pages/discussions.html" class="btn btn-ghost btn-sm" style="padding-left: 0;">
            ← Back to Discussions
          </a>
        </div>

        <!-- Main Discussion Card Container -->
        <div id="single-discussion-container"></div>

        <!-- Comments & Replies Section -->
        <div class="card" style="margin-top: 1.5rem;">
          <div class="card-header" style="margin-bottom: 1.25rem;">
            <h3 id="comments-header-title">Replies (0)</h3>
          </div>

          <!-- Add Comment Form -->
          <form id="new-comment-form" style="margin-bottom: 2rem;">
            <div class="input-group" style="margin-bottom: 0.75rem;">
              <textarea id="comment-body-input" class="textarea-field" placeholder="Share your insights, answer the question, or contribute to this discussion..." style="min-height: 90px;" required></textarea>
            </div>

            <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.75rem;">
              <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.8125rem; color: var(--text-secondary); cursor: pointer;">
                <input type="checkbox" id="comment-anonymous-cb" style="accent-color: var(--brand-primary);" />
                <span>Reply Anonymously</span>
              </label>

              <button type="submit" id="submit-comment-btn" class="btn btn-primary btn-sm btn-interactive">
                Post Reply
              </button>
            </div>
          </form>

          <!-- Comment Tree Container -->
          <div id="comments-tree-container" style="display: flex; flex-direction: column; gap: 1rem;"></div>
        </div>
      </main>

      <aside class="right-rail"></aside>
    </div>
  </div>

  <script type="module" src="/src/js/pages/discussion.js"></script>
</body>
</html>
