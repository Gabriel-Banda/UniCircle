<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Course Space — UniCircle</title>
  <link rel="stylesheet" href="/src/css/base.css" />
  <link rel="stylesheet" href="/src/css/animations.css" />
  <link rel="stylesheet" href="/src/css/components.css" />
  <link rel="stylesheet" href="/src/css/layout.css" />
</head>
<body>
  <div class="app-wrapper">
    <header class="top-header"></header>

    <div class="main-layout">
      <aside class="left-sidebar"></aside>

      <main class="content-stream">
        <div style="margin-bottom: 0.5rem;">
          <a href="/pages/home.html" class="btn btn-ghost btn-sm" style="padding-left: 0;">← Back to Home</a>
        </div>

        <div id="course-header-card"></div>

        <!-- Course Tabs -->
        <div class="tab-nav" style="margin-top: 1.5rem;">
          <button class="tab-item active" data-tab="discussions">💬 Discussions</button>
          <button class="tab-item" data-tab="questions">❓ Questions</button>
          <button class="tab-item" data-tab="resources">📂 Resources</button>
          <button class="tab-item" data-tab="groups">👥 Study Groups</button>
          <button class="tab-item" data-tab="members">🎓 Classmates</button>
        </div>

        <!-- Tab Content Containers -->
        <div id="course-tab-content" class="stagger-container"></div>
      </main>

      <aside class="right-rail"></aside>
    </div>
  </div>

  <script type="module" src="/src/js/pages/course.js"></script>
</body>
</html>
